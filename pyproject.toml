[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robotscope"
version = "1.0.0"
description = "Audit your robots.txt policy for AI crawlers (GPTBot, ClaudeBot, Bytespider and 21 more) — verdicts, warnings, JSON, CI exit codes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Mehul Patel"}]
keywords = ["robots.txt", "ai-crawlers", "seo", "aeo", "gptbot", "claudebot", "devops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
robotscope = "robotscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
